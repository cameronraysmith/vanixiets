# Named .yml rather than the repository's usual .yaml because `openwiki
# code --init` creates .github/workflows/openwiki-update.yml only when that
# exact path is missing. Under .yaml it would not see this file and would
# add a second workflow on the same schedule.
name: OpenWiki Update

on:
  schedule:
    # Weekly, Sunday 08:00 UTC. The wiki tracks architecture rather than
    # individual commits, so a daily refresh spends model budget on no-ops.
    - cron: "0 8 * * 0"
  workflow_dispatch:

concurrency:
  group: openwiki-update-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  update:
    # Scheduled workflows run on forks too, where the credential is absent.
    if: github.repository == 'cameronraysmith/vanixiets'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid and jsdom are optional; they upgrade diagram validation from a
        # heuristic to the parser GitHub itself renders with.
        run: npm install --global openwiki@0.3.3 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: anthropic
          ANTHROPIC_API_KEY: ${{ secrets.OPENWIKI_ANTHROPIC_API_KEY }}
          OPENWIKI_TELEMETRY_DISABLED: "1"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          # AGENTS.md and CLAUDE.md are listed because OpenWiki refreshes its
          # own marker block in each; everything outside those markers, which is
          # all of the hand-written context, is left untouched.
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs(openwiki): refresh generated wiki"
          title: "docs(openwiki): refresh generated wiki"
          body: |
            Scheduled refresh of the generated `openwiki/` wiki.

            Review this as a documentation diff: the generated pages describe the
            tree as it now stands, so a surprising change here usually means the
            tree changed, not that the generator misfired.
