creation_rules:
  # Home-manager user secrets (two-tier architecture from test-clan)
  - path_regex: secrets/home-manager/users/crs58/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user

  - path_regex: secrets/home-manager/users/raquel/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *raquel-user

  - path_regex: secrets/home-manager/users/janettesmith/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *janettesmith-user

  - path_regex: secrets/home-manager/users/ubuntu/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *ubuntu-user

  # Revocation: modules/home/users/claude-sandbox/README.md
  - path_regex: secrets/home-manager/users/claude-sandbox/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *claude-sandbox-user

  - path_regex: secrets/home-manager/users/christophersmith/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *christophersmith-user

  - path_regex: secrets/home-manager/users/tara/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *tara-user

  # Bridge secrets (NixOS machine age keys decrypt user age keys for HM)
  # admin-user is required for local re-encryption when adding machines
  - path_regex: secrets/bridge/.*
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *cinnabar
        - *electrum
        - *galena
        - *scheelite
        - *magnetite
        - *pyrite

  # Host-specific secrets
  - path_regex: secrets/hosts/blackphos/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *blackphos

  # Kubernetes cluster secrets (local dev cluster - operator + CI access)
  - path_regex: secrets/clusters/local/.*\.yaml$
    key_groups:
      - age:
        - *admin
        - *ci
        - *admin-user

  # Operator credentials: the operator identity and offline recovery only
  - path_regex: (secrets/services/.*\.yaml$|secrets/shared\.yaml$|secrets/test\.yaml$)
    key_groups:
      - age:
        - *admin
        - *admin-user

  # Fallback
  - path_regex: .*\.yaml$
    key_groups:
      - age:
        - *admin
        - *admin-user
        - *blackphos
