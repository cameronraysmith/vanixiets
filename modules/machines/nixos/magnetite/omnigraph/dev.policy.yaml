version: 1
groups:
  operators: [admin]
rules:
  # Loading any policy engine replaces the default-deny fallback that
  # implicitly permits `read`, so omitting `read` here revokes all access.
  # `change` also covers loads, the only ingestion path.
  - id: operator-data
    allow:
      actors: { group: operators }
      actions: [read, export, change, invoke_query]
  - id: operator-branches
    allow:
      actors: { group: operators }
      actions: [schema_apply, branch_create, branch_delete, branch_merge]
