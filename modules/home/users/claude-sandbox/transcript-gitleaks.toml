# gitleaks configuration for the claude-sandbox transcript hook
# (transcript-publish.sh): gitleaks' default rules, minus three kinds of harness
# metadata that a cloud session's transcript always holds and generic-api-key
# misreads as secrets. Each allowlist regex is anchored to the whole finding
# (regexTarget = "match"), so a real secret elsewhere on the same line, or in
# the same record, is still found. The `claude-sandbox-transcripts` check holds
# it to that: the three contexts yield no finding, and a planted canary does.

[extend]
useDefault = true

[[allowlists]]
description = "claude-sandbox transcript harness metadata"
regexTarget = "match"
regexes = [
  # The harness's GitHub scope notice: access is scoped to: `owner/repo`
  '''^access is scoped to: `[A-Za-z0-9._-]+/[A-Za-z0-9._-]+`$''',
  # The anthropic-beta list of api-request records: "name-YYYY-MM-DD","name-YYYY-MM-DD"
  '''^[a-z][a-z0-9-]*-[0-9]{4}-[0-9]{2}-[0-9]{2}"(,"[a-z][a-z0-9-]*-[0-9]{4}-[0-9]{2}-[0-9]{2}")+"?$''',
  # A turn's attribution key, a uuid: turnAttributionKey":"<uuid>"
  '''^turnAttributionKey":"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"$''',
]
