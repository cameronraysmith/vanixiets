name: version-control-and-forge
version: 0.0.0
description: Version-control and forge skills — jj workflow and history, GitButler, git commit, GitHub browse, dependency source acquisition, git-native stacked PR integration.
dependencies:
  apm:
    # worktrunk distributes two agent skills (worktrunk, wt-switch-create) as a
    # github-hosted apm dependency in object form. The nix compose resolves this
    # offline by pre-seeding apm's git checkout cache from the flake-pinned tree
    # before `apm install`, recording a remote-style resolved_commit lock with zero
    # network. The full 40-char SHA is required; a short ref forces a network fetch.
    # Upstream's tag series is not monotonic: `apm outdated` reported v0.1.4
    # (b08d381f...) as "latest", but that tag is an orphan not reachable from
    # main (verify ancestry via `gh api .../compare/<sha>...main` before
    # trusting the table on a future bump). This pin instead tracks v0.80.0,
    # the release actually reachable from main at bump time.
    - git: max-sixty/worktrunk
      ref: b49ca7eea9b03145791a5b94eccaf9c59412ed37
      skills: [worktrunk, wt-switch-create]
    # gh-stack is a Go CLI repo that also ships one agent skill under
    # skills/gh-stack/. apm types it SKILL_BUNDLE (nested skills/<name>/SKILL.md,
    # no plugin manifest and no apm.yml) and installs the skill directory with its
    # references/ siblings. Same offline resolution as worktrunk above: the nix
    # compose pre-seeds apm's git checkout cache from the flake-pinned tree, and the
    # full 40-char SHA is required because a short ref forces a network fetch. The
    # `gh stack` extension the skill drives is installed by
    # modules/home/development/gh.nix.
    - git: github/gh-stack
      ref: 14fc42ed9b6c376a53b2f999f138d3bd26dac546
      skills: [gh-stack]
    - git: Mergifyio/mergify-cli
      ref: e7c1ebbc281361f0b2b7827cf583f57339c97ebc
      skills: [mergify-stack]
