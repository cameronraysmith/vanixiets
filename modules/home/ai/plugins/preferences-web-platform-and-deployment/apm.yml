name: preferences-web-platform-and-deployment
version: 0.0.0
description: Web platform and deployment preferences — platform foundations, hypermedia development and documents, React/TanStack UI, web-application deployment, Cloudflare Wrangler, and DFINITY's Internet Computer skills (canisters, Motoko, icp-cli, deployment, identity, chain-key tokens).
dependencies:
  apm:
    # dfinity/icskills is consumed one skill directory at a time
    # (virtual-subdirectory dependencies, as obra/superpowers in
    # planning-and-development), so apm deploys each skill flat. Every line
    # shares one full 40-char SHA; the apm-deps guard fails evaluation
    # otherwise, and the apm-deps download fails unless these skills plus the
    # withheld ones listed in pkgs/by-name/apm-skills-compose/deps.nix
    # (autosync-ic-skills and autoupgrade-icp-cli, which install SessionStart
    # hooks that self-update skills or the icp toolchain) equal upstream
    # skills/ at that commit.
