[global]
remove_todos = false
remove_fixme = false
remove_docs = false
# 3.12.1's own defaults for these; declared explicitly to match the [global]
# table `uncomment init` generates. Unknown keys are a load error in 3.12.1
# (the run aborts with exit 1, or exit 2 under --check), so keep this table to
# the keys the schema accepts. Gitignored vendored/generated
# trees are skipped automatically via respect_gitignore; tracked ones go in
# `exclude` (globs relative to the config's directory, e.g. "vendor/**") or
# on the command line via --exclude.
exclude = []
use_default_ignores = true
respect_gitignore = true
traverse_git_repos = false
# Substring, case-sensitive, whole-comment match: custom preserve_patterns
# (global, per-language, and -i on the command line) match only the exact
# case written, verified on 3.12.1, and 3.10.2 behaved the same. Lowercase
# variants are deliberately not listed for the prose-like words below
# (WORKAROUND, BEGIN/END, SAFETY), because "end of loop" is ordinary prose;
# those calls belong to the skill's review workflow, not to a pattern.
# Over-preservation is the intended safe bias. Applies to every language via
# global->language merge.
#
# Deliberately absent from this list because 3.12.1 already preserves them by
# default, position-independently, anywhere in a file: TODO/FIXME/HACK/XXX/
# NOSONAR (any case), NOTE/WARNING (upper case only), ~keep, doc comments,
# eslint-/@ts-ignore/biome-ignore/deno-lint-ignore, shellcheck/yamllint/tfsec/
# checkov/trivy/tflint/hadolint directives, noqa/type: ignore/pyright:/ruff:/
# mypy:/pylint:/flake8:, prettier-ignore, fmt:off/fmt:on (spaced or not),
# clang-format off/on, clippy::/rustfmt::/allow(/cfg(, //go: directives,
# nolint, and the word forms of license notices (SPDX*, Copyright, License,
# @license, @copyright). Pragmas are case-sensitive: "# NOQA" is removed.
#
# Also deliberately absent, but only preserved by default within the first 10
# lines of a file (verified by moving an identical marker from line 10 to
# line 11 and watching it start getting removed): "DO NOT EDIT"/"DO NOT
# MODIFY"/"Code generated ..."/"Generated by ..."/"auto-generated" markers,
# matched there in any case. A generated-file notice placed later in a file is
# still removed like any other comment; the generated-marker entries below
# keep them at any position.
preserve_patterns = [
  # not covered by any built-in category.
  "WORKAROUND",
  # encoding / coding declarations: the built-in still misses "coding:" entirely.
  "coding:", "encoding:", "-*- coding",
  # bare copyright-symbol notices without the word "copyright" are still
  # removed; the word forms are already covered by defaults.
  "(c)", "(C)",
  # code-generation markers must survive at any position: past the 10-line
  # header window the built-ins remove them, and "@generated" or a bare
  # "generated" is not protected even inside it. Matching is case-sensitive,
  # so the three spellings together cover "Code generated by", "Generated by",
  # "@generated", "auto-generated", "Auto-Generated" and "AUTO-GENERATED".
  "generated", "Generated", "GENERATED", "DO NOT EDIT", "DO NOT MODIFY",
  # managed-block sentinels; broad, intentionally over-preserving; no built-in
  # equivalent exists.
  "BEGIN ", "END ",
  # Rust SAFETY: is still not covered by any built-in default.
  "SAFETY:", "SAFETY",
  # bare "rustfmt" (no "::") is not covered; only "rustfmt::skip"-style
  # usage is.
  "rustfmt",
]
