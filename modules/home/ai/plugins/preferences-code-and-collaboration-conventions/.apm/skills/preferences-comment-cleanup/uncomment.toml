[global]
remove_todos = false
remove_fixme = false
remove_docs = false
# 3.10.2's own defaults for these; declared explicitly to match the schema
# `uncomment init` generates. Unknown keys are a load error in 3.10.2, so keep
# this table to the keys that schema accepts. Gitignored vendored/generated
# trees are skipped automatically via respect_gitignore; tracked ones go in
# `exclude` (globs relative to the config's directory, e.g. "vendor/**") or
# on the command line via --exclude.
exclude = []
use_default_ignores = true
respect_gitignore = true
traverse_git_repos = false
# Substring, case-insensitive (both the built-in defaults and custom
# preserve_patterns match regardless of case), whole-comment match.
# Over-preservation is the intended safe bias. Applies to every language via
# global->language merge.
#
# Deliberately absent from this list because 3.10.2 already preserves them by
# default, position-independently, anywhere in a file: TODO/FIXME/HACK/XXX/
# NOSONAR/NOTE/~keep, doc comments, eslint-/@ts-ignore/biome-ignore/
# deno-lint-ignore, shellcheck/yamllint/tfsec/checkov/trivy/tflint/hadolint
# directives, noqa/type: ignore/pyright:/ruff:/mypy:/pylint:/flake8:,
# prettier-ignore, fmt:off/fmt:on (spaced or not), clang-format off/on,
# clippy::/rustfmt::/allow(/cfg(, //go: directives, nolint, and the word forms
# of license notices (SPDX*, Copyright, License, @license, @copyright).
#
# Also deliberately absent, but only preserved by default within the first 10
# lines of a file (verified by moving an identical marker from line 10 to
# line 11 and watching it start getting removed): "DO NOT EDIT"/"DO NOT
# MODIFY"/"Code generated ..."/"Generated by ..." markers. A generated-file
# notice placed later in a file is still removed like any other comment; the
# generated-marker entries below cover the phrasings that stay unprotected
# regardless of position.
preserve_patterns = [
  # not covered by any built-in category.
  "WORKAROUND",
  # encoding / coding declarations: the built-in still misses "coding:" entirely.
  "coding:", "encoding:", "-*- coding",
  # bare copyright-symbol notices without the word "copyright" are still
  # removed; the word forms are already covered by defaults.
  "(c)", "(C)",
  # generated-file markers not phrased as "Code generated ..." or "Generated
  # by ..." are removed at any position; since matching is case-insensitive,
  # "GENERATED" also keeps those two phrasings past the 10-line header window.
  "@generated", "GENERATED", "AUTO-GENERATED", "autogenerated", "auto-generated",
  # managed-block sentinels; broad, intentionally over-preserving; no built-in
  # equivalent exists.
  "BEGIN ", "END ",
  # Rust SAFETY: is still not covered by any built-in default.
  "SAFETY:", "SAFETY",
  # bare "rustfmt" (no "::") is not covered; only "rustfmt::skip"-style
  # usage is.
  "rustfmt",
]
