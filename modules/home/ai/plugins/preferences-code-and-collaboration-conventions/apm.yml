name: preferences-code-and-collaboration-conventions
version: 0.0.0
description: Code and collaboration conventions — style and conventions, documentation, git version control, git history cleanup, change management, prose clarity, essential complexity.
dependencies:
  apm:
    # unslop's repo root is itself the skill (SKILL.md plus load-bearing scripts/
    # and references/ siblings, no plugin.json or apm.yml), so apm types it a
    # claude_skill. The commit is pinned here only; Nix downloads it in apm-deps
    # (pkgs/by-name/apm-skills-compose/deps.nix).
    - theclaymethod/unslop#d81f5196167ded24f46fced04958c0c12d681798
    # uncomment ships one agent skill under skills/uncomment/ in the same
    # release as its CLI; the skills subset takes only that directory with its
    # references/ sibling. The commit is pinned here only; Nix downloads it in
    # apm-deps. It is the release commit of the CLI version and must equal
    # pkgs.uncomment-bin.sourceRev (structure-release-alignment-uncomment);
    # realize-pin keeps this ref and the pin's rev in step through the pin's
    # apmRef companion.
    - git: polylint/uncomment
      ref: ec906fabac0d8c9c7536c29718ced19c369f4f24
      skills: [uncomment]
