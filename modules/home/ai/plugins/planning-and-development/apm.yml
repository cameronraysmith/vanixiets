name: planning-and-development
version: 0.0.0
description: Planning and development skills — agentic planning-and-development workflow, the bundled OpenSpec change-lifecycle workflow skills, OpenSpec/Linear sync, and project management.
dependencies:
  apm:
    # superpowers as a regular (walked) remote dep pinned to the full 40-char SHA
    # (design.md D11). The nix compose resolves this offline by pre-seeding apm's
    # git checkout cache from the flake-pinned tree before `apm install`, so it
    # records a remote-style resolved_commit lock with zero network. The full SHA
    # is required; a short ref forces a network fetch.
    - obra/superpowers#b36e0829c6d0140e93cfef2ca599b1b07d4a7797
    # mattpocock/skills as a walked whole-plugin remote dep (claude-plugin repo:
    # plugin.json, no apm.yml). apm normalizes its 25 plugin.json-declared skills
    # (18 engineering + 7 productivity) into flat skills at install; the nix compose
    # pre-seeds the git checkout cache from the flake-pinned tree for zero-network
    # resolution. Full 40-char SHA required.
    - mattpocock/skills#6acc160e4e0cd062dbbbd7a1b26ae92855edf07e
    - git: srid/agency
      ref: 81455051ccca654c57ad6088838c85e7248ac159
      skills: [hickey, lowy, fact-check]
    # linear-cli ships one agent skill under skills/linear-cli/ alongside its Deno
    # CLI. openspec-linear-sync in this plugin is linear-cli-driven, so marketplace
    # consumers need the skill propagated with the plugin; the skills subset takes
    # only that skill directory with its references/ and scripts/ siblings. Same
    # offline resolution as agency above: the nix compose pre-seeds apm's git
    # checkout cache from the flake-pinned tree. The ref is the v2.6.0 tag commit
    # (full 40-char SHA; a short ref forces a network fetch) and must equal
    # pkgs.linear-cli.src.rev; the compose drift guard fails the build otherwise,
    # and pkgs/by-name/linear-cli/update.sh rewrites both in step.
    - git: schpet/linear-cli
      ref: 196315343d2bc58f30ca5d5ab40f4eb6a449fd71
      skills: [linear-cli]
# Soft coupling (agentic planning Manual execution mode): this package pairs with
# beads-issue-tracking-and-session-workflow@vanixiets, whose beads issue-tracking
# skills (issues-beads-*) have been retired pending re-base onto Linear/OpenSpec;
# the plugin retains the surviving session-layer skills. It is deliberately a
# comment, not a hard dependency — Manual mode must not force this plugin's
# co-presence on consumers that do not want it.
