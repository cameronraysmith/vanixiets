name: planning-and-development
version: 0.0.0
description: Planning and development skills — agentic planning-and-development workflow, the bundled OpenSpec change-lifecycle workflow skills, OpenSpec/Linear sync, and project management.
dependencies:
  apm:
    # superpowers and agency are consumed one skill directory at a time
    # (virtual-subdirectory dependencies), so apm never sees either
    # repository's hooks: apm >=0.36 refuses superpowers' hook pair, and
    # agency's Stop hook would land in consumers' settings. Every line of a
    # repository shares one full 40-char SHA; the apm-deps guard fails
    # evaluation otherwise, and the apm-deps download fails if the superpowers
    # list differs from upstream skills/ at that commit.
    - obra/superpowers/skills/brainstorming#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/diagnosing-superpowers#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/dispatching-parallel-agents#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/executing-plans#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/finishing-a-development-branch#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/receiving-code-review#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/requesting-code-review#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/subagent-driven-development#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/systematic-debugging#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/test-driven-development#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/using-git-worktrees#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/using-superpowers#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/verification-before-completion#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/writing-plans#22f0b463e7a5e579904dd6211a520321035526f7
    - obra/superpowers/skills/writing-skills#22f0b463e7a5e579904dd6211a520321035526f7
    - srid/agency/.apm/skills/hickey#81455051ccca654c57ad6088838c85e7248ac159
    - srid/agency/.apm/skills/lowy#81455051ccca654c57ad6088838c85e7248ac159
    - srid/agency/.apm/skills/fact-check#81455051ccca654c57ad6088838c85e7248ac159
    # mattpocock/skills is a Claude Code plugin repository (.claude-plugin/plugin.json).
    # apm >= 0.38 deploys a whole-repo plugin dependency without a skills:
    # selection whole to .agents/plugins/; the selection keeps it flat in
    # .claude/skills and .agents/skills. It lists every skill of the plugin.json
    # at this commit. The commit is pinned here only; Nix downloads it in
    # apm-deps (pkgs/by-name/apm-skills-compose/deps.nix).
    - git: mattpocock/skills
      ref: 6acc160e4e0cd062dbbbd7a1b26ae92855edf07e
      skills: [ask-matt, code-review, codebase-design, diagnosing-bugs, domain-modeling, grill-me, grill-with-docs, grilling, handoff, implement, improve-codebase-architecture, prototype, research, resolving-merge-conflicts, setup-matt-pocock-skills, tdd, teach, to-questionnaire, to-spec, to-tickets, triage, wait-what, wayfinder, wizard, writing-for-agents]
    # linear-cli ships one agent skill under skills/linear-cli/ alongside its
    # CLI. openspec-linear-sync in this plugin is linear-cli-driven, so marketplace
    # consumers need the skill propagated with the plugin; the skills subset takes
    # only that skill directory with its references/ and scripts/ siblings. The
    # commit is pinned here only; Nix downloads it in apm-deps. It is the v3.1.0
    # tag commit and must equal pkgs.linear-cli.skillSrc.rev
    # (structure-release-alignment-linear-cli); pkgs/by-name/linear-cli/update.sh
    # rewrites both in step.
    - git: schpet/linear-cli
      ref: 02571d34be662e5487204841fb80bf23ed79b4f0
      skills: [linear-cli]
    # The commit is pinned here only; Nix downloads it in apm-deps. It must equal
    # pkgs.playwright-cli.src.rev (structure-release-alignment-playwright-cli).
    - git: microsoft/playwright-cli
      ref: 74354ecc7a43da16d91a9bc54fa8db8283a3fcf5
      skills: [playwright-cli]
# Soft coupling (agentic planning Manual execution mode): this package pairs with
# beads-issue-tracking-and-session-workflow@vanixiets, whose beads issue-tracking
# skills (issues-beads-*) have been retired pending re-base onto Linear/OpenSpec;
# the plugin retains the surviving session-layer skills. It is deliberately a
# comment, not a hard dependency — Manual mode must not force this plugin's
# co-presence on consumers that do not want it.
