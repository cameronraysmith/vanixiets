# Build every system's checks that magnetite's nixbot evaluates. The system
# scope is not set here: `attribute` is one attribute path, so it cannot name
# two systems, and nixbot narrows "checks" to the instance's evalSystems
# (x86_64-linux and aarch64-darwin, modules/nixos/nixbot.nix) before
# evaluating anything (nixbot/nixbot/nix/select.nix:37-50). aarch64-linux is
# never evaluated. aarch64-darwin checks are best-effort
# (modules/checks/nixbot-best-effort-darwin.nix).
#
# nixbot reads `attribute` from the worktree being built, so a pull request
# changing it is built with its own value; the effects keys below are read
# from the default branch only.
attribute = "checks"

# herculesCI effects gating (nixbot, github:Mic92/nixbot)
#
# Deploy secrets are only ever held by code from main, so onPush effects run
# only for pushes to main.
#
# nixbot reads these keys from the default branch's nixbot.toml, never from
# the ref being built, so a pull request cannot grant itself effects
# (nixbot/effects_run.py `_effects_allowed`).
#
# A push to the default branch always runs onPush effects; other pushes run
# them only if the branch matches `effects_branches`, which is left at its
# empty default (nixbot/effects.py `should_run_effects`).
#
# `effects_on_pull_requests = false` covers ALL pull requests, not only forks:
# `should_run_effects` answers every pull-request event with this flag alone.
#
# Pull-request and merge-queue batch builds still build each gated onPush
# effect's dependencies as a check and post the `nixbot/effects` status, so
# a required `nixbot/effects` context is satisfied without running anything
# that reads secrets (nixbot/effect_checks.py `discover_checks`,
# nixbot/effects.py `check_effect`).
#
# `effects_branches = ["*"]` was wrong: the batch branch build ran and claimed
# the effects, so when gitea-mq fast-forwarded main onto that tree the reused
# build only replayed the effect statuses and main never ran them itself
# (nixbot/after_build.py `_effects`).
effects_on_pull_requests = false
