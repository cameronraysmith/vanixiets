# https://docs.devin.ai/onboard-devin/environment/git-backed-blueprints
# Nix is the only host-level dependency: it is installed through the repo's own
# pinned bootstrap, and every other tool (just, prek, treefmt, bun, jq) comes
# from the flake devshell, entered via direnv.
initialize: |
  # Pinned NixOS/nix-installer, systemd daemon planner (/run/systemd/system exists here).
  # bootstrap rather than install-nix: the sandbox image ships /usr/bin/direnv, so
  # install-direnv is a no-op today, but it self-heals if that ever goes away.
  make bootstrap

  # Nothing here grants trust: install-nix's `--extra-conf trusted-users` covers @sudo,
  # which is the group the sandbox user is in, and the installer writes that into
  # nix.conf itself. `nix store info --json` reports trusted: true after bootstrap.
  # What is left is settings the repo has no reason to carry, written to the
  # installer's own `!include` target, which is also the pre-activation seam the darwin
  # hosts migrate trusted-users out of. It is rewritten whole rather than appended to,
  # so the step is idempotent if it ever re-runs over an existing /nix, where install-nix
  # short-circuits on `command -v nix`; the only content thereby dropped is the
  # installer's copy of trusted-users, still in force from nix.conf.
  # auto-allocate-uids + cgroups are what systemd-nspawn-flavor NixOS tests need,
  # matching magnetite's and the rosetta builder's nix.settings. Their uid-range is
  # not repeated here: nix inserts it into the default system-features on every
  # linux (nix src/libstore/globals.cc:217-239, `nix config show system-features`).
  printf 'accept-flake-config = true\nauto-allocate-uids = true\nextra-experimental-features = auto-allocate-uids cgroups\n' | sudo tee /etc/nix/nix.custom.conf
  sudo systemctl restart nix-daemon.service

  . /nix/var/nix/profiles/default/etc/profile.d/nix-daemon.sh
  # Marks .envrc trusted so the maintenance step's `direnv exec .` calls work.
  direnv allow

  # Activates homeConfigurations."ubuntu@x86_64-linux" with no age key: snapshot
  # builds run with no secrets injected, so base-sops reports that it is skipping
  # the sops install and continues. The image therefore carries the generation's
  # packages, files, and session variables but nothing decrypted. Secrets arrive at
  # session start, where the profile is activated again over this warm store.
  # One-shot: it exits non-zero on failure rather than retrying, so a broken
  # sandbox is visible here rather than in every later command.
  # `--flake .` overrides the app's published default so a branch under test
  # activates itself rather than main.
  nix run --accept-flake-config .#home-bootstrap -- --flake . --without-secrets

  # Devin's per-exec BASH_ENV file runs `set -a; source "$ENVRC"; set +a`, so
  # $ENVRC is a sourced shell file rather than KEY=VALUE lines, and a BASH_ENV
  # assignment written here would reach only nested bashes, leaving the agent's
  # own exec shell without nix. Sourcing the home-manager-generated file instead
  # puts nix, the session variables, and the secret install in every tool call.
  # The -r guard keeps a missing file from breaking every shell. Written in both
  # blocks because $ENVRC is reset on every build and a differential build runs
  # maintenance only.
  : "${ENVRC:?ENVRC is unset; Devin normally provides it and this line has nowhere to go}"
  # shellcheck disable=SC2016  # $HOME resolves when Devin sources $ENVRC, not here
  grep -q 'vanixiets/session-env.sh' "$ENVRC" 2>/dev/null \
    || echo '[ -r "$HOME/.config/vanixiets/session-env.sh" ] && . "$HOME/.config/vanixiets/session-env.sh"' >> "$ENVRC"

  # QEMU-flavor NixOS tests run as a nix build user inside the sandbox, and
  # nix-daemon drops supplementary groups for those users, so adding anyone to the
  # kvm group does not reach them: qemu then reports "Could not access KVM kernel
  # module: Permission denied" and accel=kvm:tcg falls back to TCG silently, at
  # roughly an eighth of the speed. Widening the mode is what upstream systemd's
  # udev defaults do. Nix bind-mounts /dev/kvm into the sandbox on its own, so no
  # extra-sandbox-paths entry is needed.
  printf 'KERNEL=="kvm", GROUP="kvm", MODE="0666"\n' | sudo tee /etc/udev/rules.d/99-kvm.rules
  # --settle: trigger only queues the event, so without it the mode is still 0660
  # for a moment afterwards and anything checking it here races udevd.
  sudo udevadm control --reload-rules
  sudo udevadm trigger --name-match=kvm --settle
maintenance: |
  # --without-secrets here too. Maintenance runs only during builds, full and
  # differential, and a build carries no personal secrets, so the key-requiring
  # default mode would exit with "no age key source". It is never run at session
  # start; the session hook below owns the secret install. The closure is already
  # in the store, so a full build re-links and a differential build rebuilds only
  # what its commit changed. Everything below can read the profile, so it runs
  # first. home-bootstrap's default mode remains for manual and remote use, where
  # the key is present.
  nix run --accept-flake-config .#home-bootstrap -- --flake . --without-secrets

  # Devin's per-exec BASH_ENV file runs `set -a; source "$ENVRC"; set +a`, so
  # $ENVRC is a sourced shell file rather than KEY=VALUE lines, and a BASH_ENV
  # assignment written here would reach only nested bashes, leaving the agent's
  # own exec shell without nix. Sourcing the home-manager-generated file instead
  # puts nix, the session variables, and the secret install in every tool call.
  # The -r guard keeps a missing file from breaking every shell. Written in both
  # blocks because $ENVRC is reset on every build and a differential build runs
  # maintenance only.
  : "${ENVRC:?ENVRC is unset; Devin normally provides it and this line has nowhere to go}"
  # shellcheck disable=SC2016  # $HOME resolves when Devin sources $ENVRC, not here
  grep -q 'vanixiets/session-env.sh' "$ENVRC" 2>/dev/null \
    || echo '[ -r "$HOME/.config/vanixiets/session-env.sh" ] && . "$HOME/.config/vanixiets/session-env.sh"' >> "$ENVRC"

  # Realize the devshell; its shellHook writes .pre-commit-config.yaml and installs the prek hooks.
  nix develop --accept-flake-config --command true
  # Warm the nix-direnv cache so later `direnv exec .` invocations skip flake evaluation.
  direnv allow

  # `bun install` over the root workspace (packages/*), so packages/docs is covered;
  # incremental outside CI, unlike `bun run reinstall`, which maintenance forbids.
  # Playwright browsers come from the devshell's PLAYWRIGHT_BROWSERS_PATH, not a download.
  direnv exec . just install

  # .agents/ is gitignored, so a fresh clone carries none of the repo's skills, and
  # the devshell shellHook only composes AGENTS.md/CLAUDE.md - apm-skills-install is
  # what materializes .agents/skills/, which is the only place a harness discovers
  # them. `apm install --frozen` still rewrites apm.lock.yaml whenever the assembled
  # state is not semantically equal to the file, so the tracked file is put back
  # afterwards, on failure too; the snapshot is expected to start on a clean tree.
  cp apm.lock.yaml /tmp/apm.lock.yaml.pre-install
  trap 'cp /tmp/apm.lock.yaml.pre-install apm.lock.yaml' EXIT
  direnv exec . just agents-install
  cp /tmp/apm.lock.yaml.pre-install apm.lock.yaml
  trap - EXIT
knowledge:
  - name: lint
    contents: |
      direnv exec . just lint  # prek run --all-files: gitleaks + treefmt
  - name: test
    contents: |
      direnv exec . nix build .#checks.x86_64-linux.<name> # single check; cheapest feedback loop
      direnv exec . just check-fast        # nix-fast-build over checks.x86_64-linux; cold runs build whole machine toplevels
      direnv exec . just check             # full nix flake check
      # checks.x86_64-linux currently contains no NixOS-test-framework checks, so
      # nothing here exercises kvm or nspawn yet; `just test-integration` targets
      # vm-test-framework and vm-boot-all-machines, neither of which the flake defines.
      direnv exec . just test-package docs # bun unit + coverage + build + e2e
      # just test-quick is darwin-pinned (checks.aarch64-darwin.*) and cannot run here
  - name: build
    contents: |
      direnv exec . just docs-build             # typst diagrams + astro site
      direnv exec . just build-machine cinnabar # nixos hosts: cinnabar, electrum
  - name: startup
    contents: |
      direnv exec . just docs-dev  # astro dev server for packages/docs
  - name: terminal
    contents: |
      Ensure the user has access to an interactive terminal shell regardless of built-in Editor state: after the ubuntu profile is activated, start `browser-terminal` in the background (`setsid browser-terminal > logs/browser-terminal.log 2>&1 &` from the repository, or with `nohup`) and expose port 7681 through the app-preview tunnel (the `browser_preview` tool). It serves ttyd with herdr as the entrypoint; the xterm.js font list is set client-side in the wrapper because browser glyph rendering uses the user's fonts, not this VM's.
      setsid browser-terminal > logs/browser-terminal.log 2>&1 &   # from the repository root, after activation
      browser_preview 7681                                          # expose the port through the app-preview tunnel
  - name: notes
    contents: |
      Run everything through `direnv exec . <cmd>` (or `nix develop -c`): just/prek/bun exist only in the devshell.
      x86_64-linux only: darwinConfigurations and checks.aarch64-* cannot run here.
      homeConfigurations."ubuntu@x86_64-linux" is activated by the build, never with
      a secret. Both initialize and maintenance run
      `nix run .#home-bootstrap -- --flake . --without-secrets`, which activates the
      generation and leaves its sops install skipped, because a build carries no
      personal secrets in either phase. That is the same generation
      `just activate-home ubuntu` would build. Secrets arrive separately, through the
      session hook described below. Run that command by hand after pulling a commit
      that changes the ubuntu profile; the key-requiring default mode,
      `nix run .#home-bootstrap -- --flake .`, is for manual and remote use where
      SOPS_AGE_KEY is present. `--flake .` is what makes this checkout supply the
      generation instead of the app's published default, so a branch under test is
      what reaches it. Any other repository's blueprint reaches the same profile with
      no checkout
      of this one via
      `nix run --accept-flake-config github:cameronraysmith/vanixiets#home-bootstrap`,
      which requires nix installed by this repo's `make bootstrap` (it sets
      trusted-users, so the flake's substituters are then honored) and SOPS_AGE_KEY
      in the environment. Secrets for that profile decrypt from the seeded key;
      other sops/clan recipes still fail by design.
      Secrets are installed only in a session, and nothing in this blueprint installs
      them: maintenance runs during builds, not at session start. home-manager
      generates
      ~/.config/vanixiets/session-env.sh, $ENVRC sources it, and Devin sources
      $ENVRC at the top of every exec shell. When SOPS_AGE_KEY is set it seeds
      the key and runs the sops install once per key value, under a lock, logging to
      /dev/shm/ubuntu-sops/session-install.log. The age key and every decrypted
      secret live under /dev/shm/ubuntu-sops, never in $HOME and so never in the
      image; consumers such as ~/.radicle/keys/radicle are symlinks into it, created
      at install time.
      The nix store grows quickly on the sandbox disk; reclaim with `direnv exec . just gc`.
      AGENTS.md, CLAUDE.md and .agents/skills/ are generated and gitignored: entering the
      devshell composes the first two, `just agents-install` deploys the skills. Never edit
      them; edit the .apm/ fragments under modules/home/ai/plugins/ and regenerate.
